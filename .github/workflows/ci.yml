name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-client.txt -r runtime/bento/requirements.txt -e compute-fabric pytest
      - run: python scripts/privacy_scan.py --history
      - run: python -m pytest tests compute-fabric/tests runtime/bento/tests -q
      - run: python -m compileall -q plugin runtime compute-fabric scripts tests
